const lessons=[{name:'Практика расслабления',goal:'Расслабиться',desc:'Мягкое знакомство с практикой и вниманием к себе.'},{name:'Практика для наполнения устойчивостью и энергией',goal:'Почувствовать опору и энергию',desc:'Время для себя, тела и внутренней опоры.'},{name:'Практика от чувства вины',goal:'Бережно поработать с чувством вины',desc:'Практика внимания к своим переживаниям без оценки.'}];
const s={goal:'',lesson:0,after:'',product:'',page:'home'};
const app=document.getElementById('app');
const btn=(t,act,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" onclick="${act}">${t}</button>`;
const note=t=>`<div class="note"><strong>Кате · подготовить материал</strong><p>${t}</p></div>`;
function go(page){s.page=page;render();window.scrollTo(0,0)}
function choose(i){s.lesson=i;s.goal=lessons[i].goal;s.after='';go('recommend')}
function pickProduct(p){s.product=p;go('contact')}
function message(){return `Катя, здравствуйте!
${s.goal?'Мой запрос: '+s.goal+'.\n':''}${s.goal?'Я познакомился(-лась) с экспресс-уроком «'+lessons[s.lesson].name+'» в прототипе (видео пока не добавлено).\n':''}${s.after?'После знакомства отметил(-а): '+s.after+'.\n':''}Меня интересует ${s.product||'помощь в выборе формата'}.
Подскажите, пожалуйста, стоимость и условия оплаты. Хочу также уточнить бонус — индивидуальное экспресс-упражнение после оплаты.`.replaceAll('\n','
')}
function render(){let l=lessons[s.lesson];let content={
home:()=>`<span class="tag">Кундалини-йога · с Екатериной</span><h1>Вернуться<br>к себе.</h1><p class="muted">Через движение, дыхание и внимание к своему состоянию.</p><img class="hero" src="${photos[1]}" alt="Катя"><h3>Что вам нужно сейчас?</h3><p class="muted">Выберите запрос — начнём с одной практики.</p>${btn('Подобрать практику',"go('quiz')")}<div class="foot">Демонстрационный прототип. Видео и платный доступ пока не подключены.</div>`,
quiz:()=>`<div class="steps">ШАГ 1 ИЗ 3 · ВАШ ЗАПРОС</div><div class="progress"><i style="width:33%"></i></div><h2>Как вы сейчас?</h2><p class="muted">Не нужно искать правильный ответ. Выберите то, что откликается.</p>${lessons.map((x,i)=>`<button class="choice" onclick="choose(${i})">${x.goal} <span style="float:right">↗</span></button>`).join('')}`,
recommend:()=>`<span class="tag">Практика под ваш запрос</span><h2>${l.name}</h2><p class="muted">${l.desc}</p><div class="card"><small>ВАШ ЗАПРОС</small><p>${s.goal}</p><small>Продолжительность и уровень сложности уточнит Катя.</small></div>${note('Катя, дай короткое описание этого урока: для кого он, что будет внутри, точная длительность, уровень и необходимые принадлежности. Подтверди, подходит ли запись для первого знакомства.')}${btn('Открыть урок',"go('practice')")}${btn('Изменить запрос',"go('quiz')",true)}`,
practice:()=>`<span class="tag">Экспресс-урок · материал готовится</span><h2>${l.name}</h2><div class="placeholder">▷</div>${note('Катя, вот это видео надо дать или записать: «'+l.name+'». Нужен исходный файл или ссылка на запись, разрешённую для размещения в приложении. Если урок длинный, выдели отдельную законченную экспресс-версию и укажи её длительность. Добавь краткое вступление, необходимые ограничения и мягкие варианты выполнения.')}<div class="card"><h3>Перед практикой</h3><p class="muted">Здесь будет согласованная Катей инструкция по подготовке и безопасному выполнению. Сейчас упражнения не воспроизводятся.</p></div>${btn('Посмотреть следующий шаг →',"go('reflection')")}<small>Это переход по макету, а не отметка о прохождении урока.</small>`,
reflection:()=>`<div class="steps">ШАГ 2 ИЗ 3 · ОБРАТНАЯ СВЯЗЬ</div><div class="progress"><i style="width:66%"></i></div><h2>Как вы сейчас?</h2><p class="muted">После реального урока здесь можно будет отметить своё состояние. Сейчас это демонстрация интерфейса.</p>${['Спокойнее','Больше энергии','Пока без изменений','Хочу обсудить с Катей'].map(t=>`<button class="choice ${s.after===t?'selected':''}" onclick="s.after='${t}';render()">${t}</button>`).join('')}${btn('Выбрать продолжение',"go('offers')")}`,
offers:()=>`<span class="tag">Ваш следующий шаг</span><h2>В своём темпе.<br>С поддержкой Кати.</h2><div class="card"><small>САМОСТОЯТЕЛЬНО</small><h3>Записанный курс</h3><p class="muted">Практиковать тогда, когда удобно вам.</p>${note('Катя, дай название курса, точную программу, стоимость, срок доступа и способ получения материалов после оплаты.')}${btn('Интересует курс',"pickProduct('записанный курс')")}</div><div class="card"><small>ЛИЧНО С КАТЕЙ</small><h3>Индивидуальная работа</h3><p class="muted">Обсудить свой запрос и подходящий формат занятий.</p>${note('Катя, укажи стоимость, длительность, формат встречи и как согласовать время.')}${btn('Хочу индивидуально',"pickProduct('индивидуальная работа')")}</div><div class="card"><h3>Личный бонус</h3><p class="muted">Предлагаемый бонус после оплаты — индивидуальное экспресс-упражнение от Кати.</p><small>До запуска Катя должна подтвердить условия, формат и срок выдачи бонуса.</small></div>`,
contact:()=>`<div class="steps">ШАГ 3 ИЗ 3 · НАПИСАТЬ КАТЕ</div><div class="progress"><i style="width:100%"></i></div><h2>Продолжим лично?</h2><p class="muted">Подготовили сообщение для @katyatraining. Его можно отредактировать. Отправка — только вами в Telegram.</p><textarea id="msg"></textarea>${btn('Скопировать сообщение',"copyMessage()")}${btn('Открыть чат с Катей ↗',"openChat()",true)}<p id="status" class="muted" aria-live="polite"></p><small>В прототипе: скопируйте текст, откройте чат, вставьте и отправьте. Оплату и получение материалов вы согласуете с Катей лично. Покупка в приложении не оформляется.</small>`,
catalog:()=>`<h2>Начать с малого.</h2><p class="muted">Три входа в практику. Видеоматериалы пока заменены редакционными заданиями.</p>${lessons.map((x,i)=>`<div class="card"><span class="tag">Материал готовится</span><h3>${x.name}</h3><p class="muted">${x.desc}</p>${btn('Посмотреть',`choose(${i})`)}</div>`).join('')}`,
about:()=>`<img class="portrait" src="${photos[0]}" alt="Портрет Кати"><span class="tag">Ваш преподаватель</span><h2>Катя</h2><p>«Кундалини для меня — практика про чудеса».</p><p class="muted">Живу в Петербурге, веду тренинги по управлению персоналом и кундалини-йогу. Люблю танцевать, путешествовать, настольные игры и громко смеяться.</p><div class="card"><h3>Мой путь</h3><p>В 2016 году окончила курс для учителей кундалини-йоги и получила международный сертификат.</p><small>По материалам, предоставленным Катей. Имя для публикации и актуальность биографии нужно подтвердить.</small></div>${note('Катя, добавь 3–5 отзывов с разрешением на публикацию. Чужие контакты и личные данные на скриншотах нужно скрыть.')}${btn('Выбрать формат работы',"go('offers')")}`
};app.innerHTML=(content[s.page]||content.home)();if(s.page==='contact')document.getElementById('msg').value=message()}
async function copyMessage(){const el=document.getElementById('msg');try{await navigator.clipboard.writeText(el.value);document.getElementById('status').textContent='Скопировано. Теперь откройте чат и вставьте сообщение.'}catch(e){el.focus();el.select();document.getElementById('status').textContent='Выделили текст. Скопируйте его вручную.'}}
function openChat(){window.open('https://t.me/katyatraining','_blank','noopener')}
render();</script></body></html>
