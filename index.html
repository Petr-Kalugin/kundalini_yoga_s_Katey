 {title:'Практика расслабления',goal:'Хочу расслабиться',desc:'Пауза, чтобы переключить внимание на себя.'},

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(text,action,value='',secondary=false){return `<button type="button" class="btn ${secondary?'secondary':''}" data-action="${action}" data-value="${esc(value)}">${text}</button>`;}
function note(text){return `<div class="note"><small>КАТЕ · ДОБАВИТЬ МАТЕРИАЛ</small>${text}</div>`;}
function chosen(){return lessons[state.lesson===null?0:state.lesson];}
function setPage(page){state.page=page;render();window.scrollTo(0,0);}
function draft(){let lines=['Катя, здравствуйте!'];if(state.lesson!==null){lines.push('Мой запрос: '+chosen().goal+'.');lines.push('Посмотрел(а) страницу экспресс-урока «'+chosen().title+'». Видео пока ожидается.');}lines.push('Меня интересует '+(state.product||'помощь в выборе формата')+'.');lines.push('Подскажите, пожалуйста, стоимость и как оплатить. И расскажите про бонус — индивидуальное экспресс-упражнение после оплаты.');return lines.join('\n');}
function render(){let l=chosen();let html='';
 switch(state.page){
 case 'home':html=`<span class="tag">Кундалини-йога с Екатериной</span><h1>Вернуться<br>к себе.</h1><p class="muted">Через движение, дыхание и внимание к своему состоянию.</p><img class="hero" src="${document.getElementById('hero-source').src}" alt="Катя улыбается"><h3>Что вам нужно сейчас?</h3><p class="muted">Начните с запроса. Мы предложим практику для знакомства.</p>${button('Подобрать практику','page','quiz')}${button('Познакомиться с Катей','page','about',true)}`;break;
 case 'quiz':html=`<div class="label">01 / ВАШ ЗАПРОС</div><div class="progress"><div style="width:33%"></div></div><h2>Как вы сейчас?</h2><p class="muted">Выберите то, что ближе. Можно передумать в любой момент.</p>${lessons.map((x,i)=>`<button class="choice" data-action="lesson" data-value="${i}">${x.goal} ↗</button>`).join('')}`;break;
 case 'lesson':html=`<span class="tag">Знакомство с практикой</span><h2>${l.title}</h2><p class="muted">${l.desc}</p><div class="video" aria-label="Место для видео">▷</div>${note('Катя, здесь надо видео — запиши плиз или скажи, откуда можно вырезать. Если урок длинный, сделай плиз экспресс-версию без потери качества)')}${note('Добавь краткое описание, длительность, уровень и рекомендации по безопасному выполнению.')}<p class="muted">Видео скоро появится. Пока можно познакомиться с приложением и выбрать продолжение.</p>${button('Дальше →','page','reflection')}${button('Выбрать другой запрос','page','quiz',true)}`;break;
 case 'reflection':html=`<div class="label">02 / ВНИМАНИЕ К СЕБЕ</div><div class="progress"><div style="width:66%"></div></div><h2>Как вы сейчас?</h2><p class="muted">После видео здесь можно будет отметить состояние. Пока этот шаг можно просто пропустить.</p>${['Спокойнее','Больше энергии','Без изменений','Хочу обсудить с Катей'].map((x,i)=>`<button class="choice ${state.feeling===x?'selected':''}" data-action="feeling" data-value="${i}">${x}</button>`).join('')}${button('Выбрать продолжение','page','offers')}`;break;
 case 'offers':html=`<span class="tag">Ваш следующий шаг</span><h2>В своём темпе.<br>С поддержкой Кати.</h2><div class="card"><div class="label">САМОСТОЯТЕЛЬНО</div><h3>Записанный курс</h3><p class="muted">Заниматься тогда, когда удобно вам.</p>${note('Катя, дай название курса, программу, цену и условия доступа.')}${button('Хочу узнать про курс','product','записанный курс')}</div><div class="card"><div class="label">ЛИЧНО С КАТЕЙ</div><h3>Индивидуальная работа</h3><p class="muted">Обсудить запрос и подобрать формат занятий.</p>${note('Катя, укажи стоимость, длительность и формат встречи.')}${button('Хочу индивидуально','product','индивидуальная работа')}</div><div class="card"><h3>Бонус после оплаты</h3><p class="muted">Индивидуальное экспресс-упражнение от Кати.</p>${note('Катя, подтверди бонус и условия его получения.')}</div>`;break;

 case 'about':html=`<img class="portrait" src="${document.getElementById('portrait-source').src}" alt="Портрет Кати"><h2>Привет, я Катя.</h2><p>«Кундалини для меня — практика про чудеса».</p><p class="muted">Живу в Петербурге, веду тренинги по управлению персоналом и кундалини-йогу. Люблю танцевать, путешествовать, настольные игры и громко смеяться.</p><div class="card"><h3>Мой путь</h3><p>В 2016 году окончила курс для учителей кундалини-йоги и получила международный сертификат.</p><p class="muted">Дважды была на ретритах молчания и посетила более 15 йога-туров.</p></div>${note('Катя, проверь актуальность описания и дай отзывы с разрешением на публикацию.')}${button('Выбрать формат работы','page','offers')}`;break;

document.addEventListener('input',event=>{if(event.target.id==='message')state.draft=event.target.value;});
document.addEventListener('click',async event=>{
 const el=event.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action;const value=el.dataset.value;
 if(action==='page')setPage(value);
 if(action==='lesson'){state.lesson=Number(value);state.feeling='';setPage('lesson');}
 if(action==='feeling'){state.feeling=['Спокойнее','Больше энергии','Без изменений','Хочу обсудить с Катей'][Number(value)];render();}
 if(action==='product'){state.product=value;state.draft=draft();setPage('contact');}
 if(action==='copy'){
  const area=document.getElementById('message');const status=document.getElementById('status');
  try{await navigator.clipboard.writeText(area.value);status.textContent='Скопировано! Откройте чат и вставьте сообщение.';}
  catch(error){area.focus();area.select();area.setSelectionRange(0,area.value.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}status.textContent=ok?'Скопировано! Откройте чат и вставьте сообщение.':'Текст выделен — скопируйте вручную и вставьте в чат.';}
 }
});
render();
</script></body></html>
